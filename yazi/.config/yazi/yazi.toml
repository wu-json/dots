[mgr]
show_hidden = true
sort_by = "mtime"
sort_dir_first = true
sort_reverse = true
sort_case_sensitive = false
linemode = "mtime"
tabs = 1

[preview]
image_filter = "lanczos3"
image_quality = 75
syntax_highlighting = true
max_width = 800
max_height = 600
tab_title = true
cache_dir = ""

[opener]
image = [
  { run = 'open "$1"', desc = "Open in default app" },
]

[open]
rules = [
  { mime = "text/*", use = "nvim" },
  { mime = "image/*", use = "open" },
  { mime = "video/*", use = "open" },
  { mime = "audio/*", use = "open" },
  { mime = "application/pdf", use = "open" },
]

[open.nvim]
exec = "nvim"
block = true

[open.open]
exec = "open"
block = false

[tasks]
micro_workers  = 5
macro_workers  = 10
bizarre_retry  = 3
