name: Test setup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/test-init.yml'
      - 'justfile'
      - 'scripts/**'
      - 'tests/**'
      - 'homebrew/Brewfile'
      - 'fish/.config/fish/config.fish'
      - 'fish/.config/fish/conf.d/**'
      - 'pi/.pi/agent/extensions/package*.json'
      - 'swiftbar/Library/LaunchAgents/**'
      - '**/.stow-local-ignore'
  pull_request:
    paths:
      - '.github/workflows/test-init.yml'
      - 'justfile'
      - 'scripts/**'
      - 'tests/**'
      - 'homebrew/Brewfile'
      - 'fish/.config/fish/config.fish'
      - 'fish/.config/fish/conf.d/**'
      - 'pi/.pi/agent/extensions/package*.json'
      - 'swiftbar/Library/LaunchAgents/**'
      - '**/.stow-local-ignore'
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies (disposable runner only)
        run: brew install stow shellcheck fish fnm
      - run: bash -n scripts/init.sh && shellcheck scripts/init.sh
      - run: python3 -m unittest discover -s tests -v
