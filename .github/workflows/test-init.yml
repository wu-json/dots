name: Test setup
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies (disposable runner only)
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then
            brew install stow shellcheck fish
          else
            sudo apt-get update
            sudo apt-get install -y stow shellcheck fish
          fi
      - run: bash -n scripts/init.sh && shellcheck scripts/init.sh
      - run: python3 -m unittest discover -s tests -v
