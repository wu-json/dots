name: Test setup
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies (disposable runner only)
        run: brew install stow shellcheck fish
      - run: bash -n scripts/init.sh && shellcheck scripts/init.sh
      - run: python3 -m unittest discover -s tests -v
