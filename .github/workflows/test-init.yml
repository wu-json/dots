name: Test setup
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Install test dependencies
        run: brew install just stow shellcheck fish fnm
      - run: bash -n scripts/init.sh && shellcheck scripts/init.sh
      - name: Test real setup and reruns in a disposable home
        run: just test
